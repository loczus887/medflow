version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app/
    depends_on:
      - php
    networks:
      - medflow-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - medflow-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medflow_db
      POSTGRES_USER: medflow_user
      POSTGRES_PASSWORD: medflow_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - medflow-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - medflow-network

networks:
  medflow-network:
    driver: bridge

volumes:
  postgres-data: