    <script src="public/scripts/forms.js"></script>
    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
        
        const specializationSelect = document.getElementById('specialization');
        const doctorSelect = document.getElementById('doctor_id');
        const allDoctors = Array.from(doctorSelect.options).slice(1); 
        
        if (specializationSelect) {
            specializationSelect.addEventListener('change', function() {
                const selectedSpec = this.value;
                
                doctorSelect.innerHTML = '<option value="">Wybierz lekarza</option>';
                
                allDoctors.forEach(option => {
                    if (!selectedSpec || option.text.includes(selectedSpec)) {
                        doctorSelect.appendChild(option.cloneNode(true));
                    }
                });
            });
        }
    </script>
