<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Błędne żądanie | MedFlow</title>
    <link rel="stylesheet" type="text/css" href="/public/styles/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #667eea;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 32px;
            color: #333;
            margin: 1rem 0;
        }
        .error-description {
            font-size: 16px;
            color: #666;
            margin: 1rem 0 2rem 0;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .error-code {
                font-size: 80px;
            }
            .error-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">400</h1>
        <h2 class="error-title">Błędne żądanie</h2>
        <p class="error-description">
            Przesłane żądanie zawiera nieprawidłowe dane lub jest niekompletne. 
            Sprawdź poprawność wprowadzonych informacji i spróbuj ponownie.
        </p>
        <div class="error-actions">
            <a href="javascript:history.back()" class="btn btn-secondary">Wstecz</a>
            <a href="/" class="btn btn-primary">Strona główna</a>
        </div>
    </div>
</body>
</html>
