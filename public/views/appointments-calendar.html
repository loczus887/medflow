        <!-- Filtry -->
        <div class="card">
            <form method="GET" action="/appointments-calendar">
                <div class="row">
                    <div class="col-4">
                        <label for="start">Data od:</label>
                        <input type="date" name="start" id="start" value="<?= $startDate ?? '' ?>" class="form-control">
                    </div>
                    <div class="col-4">
                        <label for="end">Data do:</label>
                        <input type="date" name="end" id="end" value="<?= $endDate ?? '' ?>" class="form-control">

                            <?php if(isset($doctors)): ?>
                                <?php foreach($doctors as $doctor): ?>
                                    <option value="<?= $doctor['id'] ?>" <?= ($selectedDoctorId == $doctor['id']) ? 'selected' : '' ?>>

        <div class="appointments-section">

                <p class="no-data">Brak wizyt w wybranym zakresie</p>
            <?php else: ?>

                    <thead>

                        </tr>
                    </thead>
                    <tbody>
                        <?php foreach($appointments as $appointment): ?>
                            <tr>
                                <td data-label="Data"><?= date('d.m.Y', strtotime($appointment['appointment_date'])) ?></td>
                                <td data-label="Godzina"><?= date('H:i', strtotime($appointment['appointment_time'])) ?></td>
                                <td data-label="Lekarz">
                                    <?= htmlspecialchars($appointment['doctor_title'] . ' ' . $appointment['doctor_first_name'] . ' ' . $appointment['doctor_last_name']) ?>
                                </td>
                                <td data-label="Pacjent">
                                    <?= htmlspecialchars($appointment['patient_first_name'] . ' ' . $appointment['patient_last_name']) ?>
                                </td>
                                <td data-label="Typ">
                                    <span class="badge <?= $appointment['type'] == 'nfz' ? 'status-confirmed' : 'status-scheduled' ?>">

                                    </span>
                                </td>
                                <td data-label="Status">
                                    <span class="badge status-<?= $appointment['status'] ?>">
                                        <?= $appointment['status'] ?>
                                    </span>
                                </td>
                                <td data-label="Akcje">
                                    <a href="/view-appointment?id=<?= $appointment['id'] ?>" class="btn btn-primary btn-sm">Szczegóły</a>

                    </tbody>
